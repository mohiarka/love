<!DOCTYPE html>

<head>

      padding: 20px;
      text-align: center;
      direction: rtl;
      font-size: 22px;
      line-height: 40px;

    }
    #quote {
      max-width: 90%;
      padding: 20px;
      border-radius: 15px;

      box-shadow: 0 5px 15px rgba(0,0,0,0.1);

    }
    #newQuoteBtn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ff69b4;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }
    #newQuoteBtn:hover {
      background: #ff1493;
    }
  </style>
</head>
<body>

"نرگس کوچولوی من، خندت شروع دوباره‌ی دنیای منه 🌸",

"نرگس جانم، تو آرام‌بخش بی‌صدایی هستی که عمیق حالمو خوب می‌کنی 🌸",

    const quoteDiv = document.getElementById("quote");
    const button = document.getElementById("newQuoteBtn");

    function showQuote() {
      quoteDiv.style.opacity = 0;
      quoteDiv.style.transform = "scale(0.9)";
      
      setTimeout(() => {
        quoteDiv.innerText = quotes[Math.floor(Math.random() * quotes.length)];
        quoteDiv.style.opacity = 1;
        quoteDiv.style.transform = "scale(1)";
      }, 500);
    }

    button.addEventListener("click", showQuote);

    showQuote();
  </script>
</body>
</html>
